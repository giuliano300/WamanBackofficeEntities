<div
    [ngClass]="{'blank-page': router.url === '/authentication' || router.url === '/authentication/sign-up' || router.url === '/authentication/forgot-password' || router.url.indexOf('/reset-password') >= 0 || router.url === '/authentication/lock-screen' || router.url === '/authentication/logout' || router.url === '/authentication/confirm-email'}"
    [class.dark-theme]="toggleService.isDark()"
>
    <div
        class="route-loading-bar"
        [class.visible]="isRouteLoading"
        [class.finishing]="isRouteFinishing"
        aria-hidden="true"
    ><span></span></div>

    <!-- Sidebar -->
    <app-sidebar />
    <button
        type="button"
        class="sidebar-backdrop"
        [class.visible]="isToggled"
        (click)="toggle()"
        aria-label="Close navigation"
    ></button>

    <!-- Main Content -->
    <div
        class="main-content transition d-flex flex-column"
        [ngClass]="{'active': isToggled}"
    >
        <app-header />
        <div class="route-stage">
            <router-outlet />
        </div>
        <div class="flex-grow-1"></div>
        <app-footer />
    </div>

</div>
